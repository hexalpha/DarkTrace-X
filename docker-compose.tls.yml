services:
  elasticsearch:
    extends:
      file: docker-compose.elasticsearch-tls.yml
      service: elasticsearch
  api:
    extends:
      file: docker-compose.elasticsearch-tls.yml
      service: api
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the HTTPS application origin}
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIRECTORY:?Set TLS_CERT_DIRECTORY to the certificate directory}:/etc/nginx/tls:ro
