services:
  verify:
    extends:
      file: docker-compose.yml
      service: api
    image: darktracex-api
    profiles: [verify]
    environment:
      DARKTRACE_TEST_USE_ENV: "1"
      DARKTRACE_TEST_API_URL: http://nginx:8080/api/v1
    volumes:
      - ./apps/api/scripts:/app/scripts:ro
      - ./apps/api/tests:/app/tests:ro
    command: [python, -m, scripts.smoke_workspace]
    healthcheck:
      disable: true
