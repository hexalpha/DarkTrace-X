name: darktracex

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, core]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql+asyncpg://darktrace:darktrace@postgres:5432/darktracex
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [core]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: darktracex
      POSTGRES_USER: darktrace
      POSTGRES_PASSWORD: darktrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darktrace -d darktracex"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [core]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes: [redis-data:/data]
    networks: [core]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    volumes: [elastic-data:/usr/share/elasticsearch/data]
    networks: [core]

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, api]
    networks: [edge, core]

networks:
  edge: {}
  core:
    internal: true

volumes:
  postgres-data: {}
  redis-data: {}
  elastic-data: {}
