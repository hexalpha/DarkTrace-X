apiVersion: v1
kind: Service
metadata:
  name: darktracex-api
spec:
  selector: { app: darktracex-api }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darktracex-api
spec:
  replicas: 3
  selector: { matchLabels: { app: darktracex-api } }
  template:
    metadata: { labels: { app: darktracex-api } }
    spec:
      serviceAccountName: darktracex-api
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.example/darktracex/api:replace-with-digest
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ secretRef: { name: darktracex-runtime } }]
          readinessProbe: { httpGet: { path: /api/v1/health/ready, port: http }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/v1/health/live, port: http }, initialDelaySeconds: 15 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: darktracex-api }

