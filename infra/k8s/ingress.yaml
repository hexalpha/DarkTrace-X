apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: darktracex
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [darktracex.example.com]
      secretName: darktracex-tls
  rules:
    - host: darktracex.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: darktracex-api, port: { name: http } } }
          - path: /ws
            pathType: Prefix
            backend: { service: { name: darktracex-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: darktracex-web, port: { name: http } } }

