apiVersion: v1
kind: Service
metadata:
  name: darktracex-local-llm
spec:
  selector: { app: darktracex-local-llm }
  ports: [{ name: http, port: 8091, targetPort: http }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: darktracex-llm-model
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 8Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darktracex-local-llm
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: darktracex-local-llm } }
  template:
    metadata: { labels: { app: darktracex-local-llm } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: local-llm
          image: registry.example/darktracex/llm:replace-with-digest
          ports: [{ name: http, containerPort: 8091 }]
          envFrom: [{ secretRef: { name: darktracex-llm-runtime } }]
          env:
            - { name: LOCAL_LLM_ENABLED, value: "true" }
            - { name: LOCAL_LLM_MODEL_PATH, value: /models/selected.gguf }
            - { name: LOCAL_LLM_CONTEXT_SIZE, value: "4096" }
            - { name: LOCAL_LLM_THREADS, value: "4" }
            - { name: LOCAL_LLM_GPU_LAYERS, value: "-1" }
            - { name: LOCAL_LLM_TEMPERATURE, value: "0.2" }
            - { name: LOCAL_LLM_MAX_TOKENS, value: "512" }
          volumeMounts:
            - { name: model, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          # /health is intentionally authenticated; API dependency health polls it with X-Worker-Key.
          # Socket probes only establish process availability and avoid putting a secret in probe config.
          startupProbe: { tcpSocket: { port: http }, failureThreshold: 60, periodSeconds: 10 }
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: "1", memory: 4Gi }, limits: { cpu: "4", memory: 8Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: model, persistentVolumeClaim: { claimName: darktracex-llm-model } }
        - { name: tmp, emptyDir: {} }
