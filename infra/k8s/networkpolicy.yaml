apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: darktracex-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: darktracex-web-to-api
spec:
  podSelector: { matchLabels: { app: darktracex-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: darktracex-web } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: darktracex-ingress-to-web
spec:
  podSelector: { matchLabels: { app: darktracex-web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ protocol: TCP, port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: darktracex-api-to-local-llm
spec:
  podSelector: { matchLabels: { app: darktracex-local-llm } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: darktracex-api } }
      ports: [{ protocol: TCP, port: 8091 }]
