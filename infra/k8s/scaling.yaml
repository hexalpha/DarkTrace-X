apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: darktracex-api
spec:
  minAvailable: 2
  selector: { matchLabels: { app: darktracex-api } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: darktracex-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: darktracex-api }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: darktracex-web
spec:
  minAvailable: 1
  selector: { matchLabels: { app: darktracex-web } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: darktracex-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: darktracex-web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
